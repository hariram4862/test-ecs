<!doctype html><html><head><meta charset="utf-8"><title>Mastro Agent Pool</title></head>
<body><h1>Mastro Agent Pool Demo</h1><button id="start">Start Workflow</button><pre id="output"></pre>
<script>
document.querySelector("#start").onclick=async()=>{const out=document.querySelector("#output");out.textContent="RUNNING...";
const r=await fetch("/workflow/start",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({workflow_id:crypto.randomUUID()})});
out.textContent=JSON.stringify(await r.json(),null,2)};
</script></body></html>
